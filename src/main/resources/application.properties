# Application
spring.application.name=backend
server.port=${SERVER_PORT:8080}

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coderound_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresql}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true

# Judge0 CE Configuration
judge0.base-url=${JUDGE0_BASE_URL:http://localhost:2358}
judge0.api-key=${JUDGE0_API_KEY:}
judge0.timeout-seconds=${JUDGE0_TIMEOUT_SECONDS:15}
judge0.poll-interval-ms=${JUDGE0_POLL_INTERVAL_MS:500}